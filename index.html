<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подключение к серверу Steam</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(145deg, #1a1a2e, #16213e, #0f3460);
            color: #fff;
            padding: 20px;
            margin: 0;
            animation: fadeIn 1.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 32px;
            padding: 50px 40px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0); }
        }
        .logo {
            margin-bottom: 24px;
        }
        .logo svg {
            width: 80px;
            height: 80px;
            filter: drop-shadow(0 0 15px rgba(0, 150, 255, 0.4));
        }
        h1 {
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #66b0ff, #4a8cd4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 28px;
            line-height: 1.5;
        }
        .ip-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 14px 18px;
            margin-bottom: 30px;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: inline-block;
            backdrop-filter: blur(4px);
        }
        .ip-box span {
            color: #7cb8ff;
        }
        .timer {
            font-size: 48px;
            font-weight: 300;
            color: #66b0ff;
            margin: 10px 0 20px;
            letter-spacing: 2px;
        }
        .timer span {
            font-weight: 600;
            color: #fff;
        }
        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin: 16px 0 28px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #4a8cd4, #66b0ff);
            border-radius: 4px;
            animation: shrink 60s linear forwards;
        }
        @keyframes shrink {
            from { width: 100%; }
            to { width: 0%; }
        }
        .button {
            display: inline-block;
            padding: 14px 34px;
            background: linear-gradient(135deg, #2d7dd2, #1a5ba8);
            color: #fff;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.25s ease;
            box-shadow: 0 8px 20px rgba(26, 91, 168, 0.4);
            letter-spacing: 0.3px;
        }
        .button:hover {
            transform: scale(1.04);
            box-shadow: 0 12px 28px rgba(26, 91, 168, 0.6);
            background: linear-gradient(135deg, #3a8ae0, #2268c0);
        }
        .button:active {
            transform: scale(0.96);
        }
        .button-secondary {
            background: rgba(255, 255, 255, 0.08);
            box-shadow: none;
            margin-left: 12px;
            padding: 14px 24px;
        }
        .button-secondary:hover {
            background: rgba(255, 255, 255, 0.16);
            box-shadow: none;
        }
        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.3);
        }
        .footer a {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            transition: color 0.2s;
        }
        .footer a:hover {
            color: rgba(255, 255, 255, 0.8);
        }
        @media (max-width: 500px) {
            .container { padding: 30px 20px; }
            h1 { font-size: 22px; }
            .timer { font-size: 36px; }
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="10" stroke="#66b0ff" stroke-width="1.5"/>
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z" fill="#1a5ba8" opacity="0.3"/>
            <circle cx="12" cy="12" r="4" fill="#66b0ff"/>
            <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4z" fill="#fff" opacity="0.2"/>
            <path d="M16 6l2 2-1 1-2-2 1-1z" fill="#66b0ff"/>
            <path d="M6 18l2 2-1 1-2-2 1-1z" fill="#66b0ff"/>
        </svg>
    </div>
    <h1>Подключение к серверу</h1>
    <p class="subtitle">Steam запустится автоматически через несколько секунд</p>
    
    <div class="ip-box">
        <span id="serverIp">157.228.135.105:27015</span>
    </div>

    <div class="timer">
        <span id="seconds">60</span> с
    </div>
    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <div>
        <a href="steam://connect/157.228.135.105:27015" class="button" id="connectBtn">▶ Подключиться сейчас</a>
        <button class="button button-secondary" id="closeBtn">✕ Закрыть</button>
    </div>
    <div class="footer">
        Страница закроется автоматически через 60 секунд<br>
        <span style="opacity:0.5;">Если Steam не открылся, нажмите кнопку выше</span>
    </div>
</div>

<script>
    (function() {
        // IP и порт (измените под себя)
        const SERVER_IP = '157.228.135.105:27015';
        document.getElementById('serverIp').textContent = SERVER_IP;
        const CONNECT_URL = 'steam://connect/' + SERVER_IP;

        // Обновляем ссылку на кнопке
        document.getElementById('connectBtn').href = CONNECT_URL;

        // 🔽 АВТОМАТИЧЕСКИЙ РЕДИРЕКТ ПРИ ЗАГРУЗКЕ (через 0.5 сек)
        setTimeout(() => {
            window.location.href = CONNECT_URL;
        }, 500);

        // Таймер обратного отсчёта (60 секунд)
        let remaining = 60;
        const secondsSpan = document.getElementById('seconds');
        const progressFill = document.getElementById('progressFill');

        function updateTimer() {
            secondsSpan.textContent = remaining;
        }

        const timerInterval = setInterval(function() {
            remaining -= 1;
            if (remaining <= 0) {
                clearInterval(timerInterval);
                try {
                    window.close();
                } catch (e) {
                    window.location.href = 'about:blank';
                }
                return;
            }
            updateTimer();
        }, 1000);

        // Кнопка закрытия
        document.getElementById('closeBtn').addEventListener('click', function() {
            try {
                window.close();
            } catch (e) {
                window.location.href = 'about:blank';
            }
        });
    })();
</script>

</body>
</html>
