<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[TC] Заблудшие души — Подключение...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Oswald:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --tf-orange: #c4783a;
      --tf-orange-light: #e8a060;
      --tf-gold: #e8c9a0;
      --tf-dark: #0d0705;
      --tf-darker: #080403;
      --tf-text: #e8ddd4;
      --tf-muted: #a08060;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--tf-darker);
      font-family: 'Oswald', sans-serif;
      color: var(--tf-text);
    }

    #canvas-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background:
        radial-gradient(circle at 20% 80%, rgba(180, 90, 30, 0.06) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(200, 100, 40, 0.04) 0%, transparent 50%);
      pointer-events: none;
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      box-shadow: inset 0 0 150px rgba(0,0,0,0.7);
    }

    .container {
      position: relative;
      z-index: 10;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .tag {
      font-family: 'Cinzel', serif;
      font-size: 12px;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: var(--tf-orange);
      margin-bottom: 16px;
      opacity: 0;
      animation: fadeIn 1s 0.3s forwards;
    }

    .title {
      font-family: 'Cinzel', serif;
      font-size: clamp(32px, 8vw, 72px);
      font-weight: 900;
      line-height: 1.1;
      color: var(--tf-text);
      text-shadow:
        0 2px 30px rgba(180, 90, 30, 0.3),
        0 0 80px rgba(180, 90, 30, 0.1);
      margin-bottom: 8px;
      opacity: 0;
      animation: fadeIn 1.2s 0.6s forwards, glow 4s 2s infinite alternate;
    }

    .subtitle {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(12px, 2.5vw, 18px);
      font-weight: 300;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: var(--tf-muted);
      margin-bottom: 24px;
      opacity: 0;
      animation: fadeIn 1s 0.9s forwards;
    }

    .redirect-msg {
      font-size: 14px;
      color: var(--tf-orange-light);
      letter-spacing: 2px;
      margin-bottom: 8px;
      opacity: 0;
      animation: fadeIn 1s 1.1s forwards;
    }

    .ip-display {
      font-family: 'Cinzel', serif;
      font-size: 16px;
      color: var(--tf-gold);
      letter-spacing: 2px;
      margin-bottom: 24px;
      opacity: 0;
      animation: fadeIn 1s 1.2s forwards;
    }

    .timer-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 32px;
      opacity: 0;
      animation: fadeIn 1s 1.4s forwards;
    }

    .timer-label {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--tf-muted);
      margin-bottom: 8px;
    }

    .timer-bar {
      width: 200px;
      height: 3px;
      background: rgba(196, 120, 58, 0.15);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }

    .timer-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, var(--tf-orange), var(--tf-orange-light));
      transform-origin: left;
      animation: shrink 60s linear forwards;
    }

    .timer-text {
      font-family: 'Cinzel', serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--tf-gold);
      margin-top: 10px;
      font-variant-numeric: tabular-nums;
    }

    .divider {
      width: 100px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--tf-orange), transparent);
      margin-bottom: 28px;
      opacity: 0;
      animation: fadeIn 1s 1.0s forwards, expand 1.5s 1.0s forwards;
      transform: scaleX(0);
    }

    .info-grid {
      display: flex;
      gap: 40px;
      margin-bottom: 32px;
      flex-wrap: wrap;
      justify-content: center;
      opacity: 0;
      animation: fadeIn 1s 1.6s forwards;
    }

    .info-item {
      text-align: center;
      min-width: 70px;
    }

    .info-item .val {
      font-family: 'Cinzel', serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--tf-gold);
      line-height: 1;
    }

    .info-item .lab {
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--tf-muted);
      margin-top: 6px;
    }

    .btn-group {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      opacity: 0;
      animation: fadeIn 1s 1.8s forwards;
    }

    .btn {
      font-family: 'Oswald', sans-serif;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding: 14px 40px;
      border: 1px solid var(--tf-orange);
      background: rgba(196, 120, 58, 0.08);
      color: var(--tf-gold);
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(196, 120, 58, 0.25), transparent);
      transform: translateX(-100%);
      transition: transform 0.6s ease;
    }

    .btn:hover {
      background: rgba(196, 120, 58, 0.18);
      border-color: var(--tf-orange-light);
      color: #fff;
      box-shadow: 0 0 30px rgba(196, 120, 58, 0.25);
      transform: translateY(-2px);
    }

    .btn:hover::before {
      transform: translateX(100%);
    }

    .btn-primary {
      background: rgba(196, 120, 58, 0.15);
    }

    .footer {
      position: absolute;
      bottom: 24px;
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #503820;
      opacity: 0;
      animation: fadeIn 1s 2.2s forwards;
    }

    .close-notice {
      position: absolute;
      bottom: 48px;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #604830;
      opacity: 0;
      animation: fadeIn 1s 2.0s forwards;
    }

    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes expand { to { transform: scaleX(1); } }
    @keyframes glow {
      from { text-shadow: 0 2px 30px rgba(180, 90, 30, 0.3), 0 0 80px rgba(180, 90, 30, 0.1); }
      to { text-shadow: 0 2px 40px rgba(200, 110, 40, 0.5), 0 0 100px rgba(200, 110, 40, 0.2); }
    }
    @keyframes shrink { to { transform: scaleX(0); } }

    @media (max-width: 480px) {
      .info-grid { gap: 24px; }
      .btn { padding: 12px 28px; font-size: 12px; }
      .timer-bar { width: 160px; }
    }
  </style>
<base target="_blank">
</head>
<body>

  <canvas id="canvas-bg"></canvas>
  <div class="overlay"></div>
  <div class="vignette"></div>

  <div class="container">
    <div class="tag">Team Fortress 2</div>
    <div class="title">[TC]<br>Заблудшие души</div>
    <div class="subtitle">Сервер для избранных</div>

    <div class="divider"></div>

    <div class="redirect-msg">Автоматическое подключение к серверу...</div>
    <div class="ip-display">157.228.135.105:27015</div>

    <div class="timer-wrap">
      <div class="timer-label">Окно закроется через</div>
      <div class="timer-bar"><div class="timer-fill"></div></div>
      <div class="timer-text" id="countdown">60</div>
    </div>

    <div class="info-grid">
      <div class="info-item">
        <div class="val">32</div>
        <div class="lab">Слотов</div>
      </div>
      <div class="info-item">
        <div class="val">24/7</div>
        <div class="lab">Онлайн</div>
      </div>
      <div class="info-item">
        <div class="val">RU</div>
        <div class="lab">Регион</div>
      </div>
      <div class="info-item">
        <div class="val">NoCrits</div>
        <div class="lab">Режим</div>
      </div>
    </div>

    <div class="btn-group">
      <a href="steam://connect/157.228.135.105:27015" class="btn btn-primary" id="connectBtn">Подключиться</a>
      <a href="https://steamcommunity.com/groups/tc_zabludshie" class="btn" target="_blank">Группа Steam</a>
    </div>

    <div class="close-notice">Эта вкладка закроется автоматически</div>
    <div class="footer">Создано с душой · [TC] Заблудшие души</div>
  </div>

  <script>
    // === АВТОРЕДИРЕКТ ПРИ ЗАГРУЗКЕ ===
    (function() {
      const serverUrl = 'steam://connect/157.228.135.105:27015';
      // Пытаемся открыть Steam-протокол сразу
      window.location.href = serverUrl;
    })();

    // === ТАЙМЕР ОБРАТНОГО ОТСЧЁТА ===
    let seconds = 60;
    const countdownEl = document.getElementById('countdown');
    const timer = setInterval(() => {
      seconds--;
      countdownEl.textContent = seconds;
      if (seconds <= 0) {
        clearInterval(timer);
        countdownEl.textContent = '0';
      }
    }, 1000);

    // === АВТОЗАКРЫТИЕ ЧЕРЕЗ 60 СЕКУНД ===
    setTimeout(() => {
      // Пробуем разные способы закрыть окно/вкладку
      try {
        window.close();
      } catch(e) {}
      // Fallback для случаев, когда window.close() заблокирован
      try {
        window.open('', '_self').close();
      } catch(e) {}
      // Если ничего не сработало — показываем сообщение
      document.querySelector('.close-notice').textContent = 'Можете закрыть эту вкладку';
      document.querySelector('.close-notice').style.color = '#c4783a';
    }, 60000);

    // === КНОПКА ПОДКЛЮЧИТЬСЯ ===
    document.getElementById('connectBtn').addEventListener('click', function(e) {
      e.preventDefault();
      window.location.href = 'steam://connect/157.228.135.105:27015';
    });

    // === АНИМАЦИЯ ЧАСТИЦ ===
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');
    let particles = [];
    const PARTICLE_COUNT = 60;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 0.5;
        this.speedX = (Math.random() - 0.5) * 0.3;
        this.speedY = -Math.random() * 0.5 - 0.1;
        this.opacity = Math.random() * 0.5 + 0.1;
        this.fade = Math.random() * 0.005 + 0.002;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.opacity -= this.fade;
        if (this.opacity <= 0 || this.y < -10) {
          this.reset();
          this.y = canvas.height + 10;
          this.opacity = 0;
          let fadeIn = setInterval(() => {
            this.opacity += 0.02;
            if (this.opacity >= Math.random() * 0.5 + 0.1) clearInterval(fadeIn);
          }, 30);
        }
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(212, 160, 100, ${this.opacity})`;
        ctx.fill();
      }
    }

    for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animate);
    }
    animate();
  </script>

</body>
</html>
